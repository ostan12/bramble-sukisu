name: Build SukiSU-Ultra Kernel (bramble LOS24)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'LineageOS Kernel Branch (z.B. lineage-24.0 oder lineage-23.2)'
        required: true
        default: 'lineage-24.0'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev make zip unzip python3 cpio libelf-dev dwarves git curl

      - name: Clone LineageOS redbull kernel & Toolchain
        run: |
          mkdir -p work && cd work
          git clone --depth=1 -b ${{ github.event.inputs.branch }} https://github.com/LineageOS/android_kernel_google_redbull.git kernel
          git clone --depth=1 https://gitlab.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-r547379.git clang
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git

      - name: Integrate SukiSU-Ultra & patch defconfig
        run: |
          cd work/kernel
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s builtin
          DEFCONFIG="arch/arm64/configs/vendor/redbull_defconfig"
          [ ! -f "$DEFCONFIG" ] && DEFCONFIG="arch/arm64/configs/redbull_defconfig"
          cat << 'EOF' >> "$DEFCONFIG"
          CONFIG_KSU=y
          CONFIG_KSU_HACK_ARM64_BRANCH_LINK=y
          CONFIG_KALLSYMS=y
          CONFIG_KALLSYMS_ALL=y
          CONFIG_KPM=y
          EOF

      - name: Compile Kernel
        run: |
          cd work/kernel
          export PATH="$GITHUB_WORKSPACE/work/clang/bin:$PATH"
          DEFCONFIG_NAME="vendor/redbull_defconfig"
          [ ! -f "arch/arm64/configs/vendor/redbull_defconfig" ] && DEFCONFIG_NAME="redbull_defconfig"
          make -j$(nproc) O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- $DEFCONFIG_NAME
          make -j$(nproc) O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-

      - name: Package AnyKernel3
        run: |
          cd work
          cp kernel/out/arch/arm64/boot/Image.lz4 AnyKernel3/
          [ -f kernel/out/arch/arm64/boot/dtbo.img ] && cp kernel/out/arch/arm64/boot/dtbo.img AnyKernel3/
          cd AnyKernel3
          sed -i 's/device.name1=maguro/device.name1=bramble/' anykernel.sh
          sed -i 's/device.name2=toro/device.name2=redfin/' anykernel.sh
          sed -i 's|block=/dev/block/platform/omap/omap_hsmmc.0/by-name/boot;|block=/dev/block/bootdevice/by-name/boot;|' anykernel.sh
          sed -i 's/is_slot_device=0;/is_slot_device=1;/' anykernel.sh
          zip -r9 "$GITHUB_WORKSPACE/SukiSU-bramble.zip" * -x .git README.md *placeholder

      - name: Upload Kernel ZIP
        uses: actions/upload-artifact@v4
        with:
          name: SukiSU-bramble
          path: SukiSU-bramble.zip
